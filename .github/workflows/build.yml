name: Build Mobile Haptics

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare native directories
        run: |
          mkdir -p src/main/resources/native/arm64-v8a
          mkdir -p src/main/resources/native/x86_64

      - name: Build ARM64 native library
        run: |
          export NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$NDK_BIN/clang" \
            --target=aarch64-linux-android24 \
            -shared \
            -fPIC \
            -O2 \
            src/main/cpp/mobilehaptics.c \
            -o src/main/resources/native/arm64-v8a/libmobilehaptics.so

      - name: Build x86_64 native library
        run: |
          export NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$NDK_BIN/clang" \
            --target=x86_64-linux-android24 \
            -shared \
            -fPIC \
            -O2 \
            src/main/cpp/mobilehaptics.c \
            -o src/main/resources/native/x86_64/libmobilehaptics.so

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.14.3

      - name: Build Minecraft mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: mobile-haptics
          path: build/libs/*.jar